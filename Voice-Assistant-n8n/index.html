<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
        }

        /* Modern Crisp Wave Animation */
        @keyframes smoothWave {
            0%, 100% { transform: scaleY(0.2); }
            50% { transform: scaleY(1); }
        }
        
        .wave-bar { 
            transform-origin: center;
            animation: smoothWave 0.8s ease-in-out infinite; 
        }
        
        /* Professional staggered timing for natural motion */
        .wave-bar:nth-child(1) { animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { animation-delay: 0.5s; }
        .wave-bar:nth-child(4) { animation-delay: 0.2s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { animation-delay: 0.6s; }
        .wave-bar:nth-child(7) { animation-delay: 0.15s; }
    </style>
</head>
<body class="text-neutral-300 min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- High-Contrast Clean Card Container -->
    <div id="mainContainer" class="w-full max-w-xl bg-neutral-950 border border-neutral-800 p-8 rounded-xl shadow-2xl transition-all duration-300">
        
        <!-- Header Section -->
        <div class="mb-8">
            <div class="flex items-center gap-2">
                <span id="statusIndicator" class="h-2 w-2 bg-neutral-600 rounded-full transition-colors duration-300"></span>
                <span class="text-[11px] font-semibold text-blue-500 uppercase tracking-wider">System Ready</span>
            </div>
            <h1 class="text-2xl font-semibold text-white tracking-tight mt-1">Voice Assistant</h1>
            <p class="text-sm text-neutral-400 mt-1">Record your tasks using voice. The system will automatically convert it to text and execute it.</p>
        </div>

        <!-- Main Workspace Controls -->
        <div class="space-y-6">
            
            <!-- Recording & Audio Visualizer Box -->
            <div id="dropzone" class="relative flex flex-col items-center justify-center border border-neutral-800 rounded-lg p-12 bg-neutral-900/40 transition-all duration-300">
                
                <!-- Professional Blue-Gradient Audio Waves -->
                <div id="visualizer" class="hidden absolute inset-0 flex items-center justify-center gap-1.5 bg-neutral-950 rounded-lg px-12">
                    <div class="wave-bar w-1.5 h-12 bg-blue-600 rounded-full"></div>
                    <div class="wave-bar w-1.5 h-12 bg-blue-500 rounded-full"></div>
                    <div class="wave-bar w-1.5 h-12 bg-blue-400 rounded-full"></div>
                    <div class="wave-bar w-1.5 h-12 bg-white rounded-full"></div>
                    <div class="wave-bar w-1.5 h-12 bg-blue-400 rounded-full"></div>
                    <div class="wave-bar w-1.5 h-12 bg-blue-500 rounded-full"></div>
                    <div class="wave-bar w-1.5 h-12 bg-blue-600 rounded-full"></div>
                </div>

                <!-- Record Button -->
                <button id="recordBtn" class="relative z-10 h-16 w-16 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 rounded-full flex items-center justify-center text-white transition-all duration-200 active:scale-95 shadow-lg shadow-blue-600/10">
                    <svg id="micIcon" class="w-6 h-6 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
                <p id="statusText" class="relative z-10 text-xs text-neutral-400 mt-4 font-medium tracking-wide">Click button to start recording</p>
            </div>

            <!-- Text Preview & Editor Area -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Text Preview</label>
                    <span class="text-[10px] bg-neutral-900 text-neutral-400 px-2 py-0.5 rounded border border-neutral-800 font-mono">Editable</span>
                </div>
                <textarea id="taskText" rows="4" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-4 py-3 text-white placeholder-neutral-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm resize-none leading-relaxed" placeholder="Your voice text will appear here. You can also edit this text manually before saving."></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3 pt-1">
                <button id="processAudioBtn" class="flex-1 bg-neutral-900 hover:bg-neutral-800 text-neutral-300 hover:text-white font-medium py-3 px-4 rounded-lg transition-all text-sm border border-neutral-800 hover:border-neutral-700 flex items-center justify-center gap-2">
                    Convert to Text
                </button>
                <button id="submitTaskBtn" class="flex-1 bg-white hover:bg-neutral-100 text-black font-semibold py-3 px-4 rounded-lg transition-all text-sm flex items-center justify-center gap-2 active:scale-[0.99]">
                    Submit Task
                </button>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        const WEBHOOK_TRANSCRIBE_URL = 'https://student-iq.app.n8n.cloud/webhook/transcribe';
        const WEBHOOK_EXECUTE_URL = 'https://student-iq.app.n8n.cloud/webhook/execute';

        const recordBtn = document.getElementById('recordBtn');
        const statusText = document.getElementById('statusText');
        const taskText = document.getElementById('taskText');
        const processAudioBtn = document.getElementById('processAudioBtn');
        const submitTaskBtn = document.getElementById('submitTaskBtn');
        const dropzone = document.getElementById('dropzone');
        const visualizer = document.getElementById('visualizer');
        const statusIndicator = document.getElementById('statusIndicator');

        // Recording Handle Logic
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                audioChunks = [];
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = async () => {
                    statusText.innerText = "Recording saved. Ready to convert.";
                    dropzone.classList.remove('border-blue-500/50');
                    visualizer.classList.add('hidden');
                    statusIndicator.classList.remove('bg-blue-500', 'animate-pulse');
                    statusIndicator.classList.add('bg-neutral-600');
                    recordBtn.classList.remove('bg-white', 'text-black');
                    recordBtn.classList.add('bg-blue-600', 'text-white');
                };

                mediaRecorder.start();
                statusText.innerText = "Recording voice... Click again to stop";
                dropzone.classList.add('border-blue-500/50');
                visualizer.classList.remove('hidden');
                statusIndicator.classList.remove('bg-neutral-600');
                statusIndicator.classList.add('bg-blue-500', 'animate-pulse');
                recordBtn.classList.remove('bg-blue-600', 'text-white');
                recordBtn.classList.add('bg-white', 'text-black');
            } else {
                mediaRecorder.stop();
            }
        });

        // Action 1: Transcribe
        processAudioBtn.addEventListener('click', async () => {
            if (audioChunks.length === 0) return alert("Please record some audio first.");
            
            statusText.innerText = "Converting voice to text...";
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append('file', audioBlob, 'voice.wav');

            try {
                const response = await fetch(WEBHOOK_TRANSCRIBE_URL, { method: 'POST', body: formData });
                const data = await response.json();
                taskText.value = data.transcription;
                statusText.innerText = "Conversion successful.";
            } catch (err) {
                console.error(err);
                statusText.innerText = "Error converting audio.";
            }
        });

        // Action 2: Submit
        submitTaskBtn.addEventListener('click', async () => {
            const finalInput = taskText.value.trim();
            if (!finalInput) return alert("Text field cannot be empty.");

            statusText.innerText = "Submitting task to system...";
            try {
                const response = await fetch(WEBHOOK_EXECUTE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: finalInput })
                });
                if (response.ok) {
                    statusText.innerText = "Task submitted successfully.";
                    taskText.value = "";
                    audioChunks = [];
                }
            } catch (err) {
                console.error(err);
                statusText.innerText = "Error submitting task.";
            }
        });
    </script>
</body>
</html>
